ications related to mobile robotics and adaptive control.",stats:[{value:"7+",label:"Years of university teaching"},{value:"6",label:"Years as a power-plant engineer"},{value:"5",label:"Peer-reviewed publications"},{value:"2026",label:"Expected PhD completion"}]},interests:{eyebrow:"02 — Focus",heading:"Research & Teaching Interests",intro:"The threads running through my doctoral work and lecturing practice.",items:[{title:"Dual-Mode Mobile Robotics",body:"Rough-terrain and planetary exploration rovers, including ground-to-vertical dual-mode systems."},{title:"Reinforcement-Learning-Based Control",body:"Adaptive PID and RL-driven controllers (DDPG, TD3, DDQN) for steering, velocity, and stability."},{title:"Advanced Control & Simulation",body:"High-fidelity modelling in MATLAB/Simulink and Simscape Multibody for dynamics and terrain interaction."},{title:"Mechanical Design & Prototyping",body:"Mechanical design, assembly, sensor integration, and experimental validation of rover hardware."}]},projects:{eyebrow:"03 — Research",heading:"Research Projects",intro:"Selected work from my PhD research at Guilin University of Electronic Technology (GUET), on robotics design, modelling, and adaptive control.",items:[{tag:"Rover Platform",title:"Six-Wheel Rocker-Bogie Rover",description:"Designed and developed a six-wheel rocker-bogie rover platform inspired by planetary exploration rovers, with emphasis on rough-terrain mobility, passive suspension articulation, and obstacle-crossing capability."},{tag:"Dual-Mode System",title:"ClimbNav-R — Ground-to-Vertical Climbing Robot",description:"Developed a dual-mode robotic system integrating a ground rover with a detachable climbing mechanism for operation in limited-access environments such as trees, poles, and uneven outdoor terrain."},{tag:"High-Fidelity Simulation",title:"Simulink & Simscape Multibody Dynamics",description:"Built high-fidelity simulation models using MATLAB/Simulink and Simscape Multibody to analyse rover dynamics, wheel–terrain interaction, suspension behaviour, and system stability under different terrain conditions."},{tag:"Adaptive Control",title:"DDPG-Based Adaptive PID Control",description:"Designed and implemented reinforcement-learning-based adaptive PID control frameworks using DDPG for steering and velocity regulation of a six-wheel rocker-bogie rover."},{tag:"Validation Study",title:"Comparative Control Analysis",description:"Conducted simulation-based validation and comparative analysis of conventional PID, baseline DDPG, and shaped-reward DDPG control strategies for trajectory tracking and motion stability."},{tag:"Hardware",title:"Experimental Rover Prototyping",description:"Supported experimental prototyping and validation of custom rover hardware, including mechanical assembly, sensor integration, encoder-based measurement, and terrain traversal testing."}]},publications:{eyebrow:"04 — Output",heading:"Publications",intro:"Peer-reviewed journal articles and conference proceedings.",viewPaper:"View Paper / DOI",scholarBtn:"Google Scholar",underRevision:"Under revision",items:[{authors:"Alameer, M., Yao, L., Liu, X. et al.",title:"ClimbNav-R: A dual-mode robot for seamless ground-to-vertical transitions in limited-access environments",venue:"Journal of Mechanical Science and Technology",year:"2026",doiUrl:"https://doi.org/10.1007/s12206-026-0451-2",doiLabel:"10.1007/s12206-026-0451-2",abstractSummary:"Navigating unstructured and confined environments presents a significant challenge for robotic platforms. This paper presents ClimbNav-R, a dual-mode robotic system combining a re-engineered rocker-bogie chassis with a detachable seven-degree-of-freedom (7-DOF) climbing module. Its novelty lies in a decoupled, mechanically and kinematically integrated design, allowing each mode to be optimized for its specific function, enabling load-bearing transitions, enhanced climbing, and stable operation. ClimbNav-R employs kinematic modeling, PID control, and a hybrid bicycle-Ackermann steering approach to achieve stable ground and climbing mobility, while transition stability is ensured through detailed kinematic analysis of the mode-switching process. Experimental evaluations across five terrain types, including flat, inclined, and stepped surfaces, demonstrate the system’s ability to overcome 15 cm obstacles. Power consumption increased by 50% on flat rough terrain, 30% on inclined smooth terrain, and 100% on inclined rough terrain compared to flat smooth terrain. Results validate ClimbNav-R’s performance and potential for outdoor applications. Future work targets autonomy and energy optimization.",keywords:["Dual-mode robotic system","Rocker-bogie locomotion","Climbing mechanism","Locomotion integration","Limited-access environments"],figures:[{src:"assets/climbnav/climbnav-platform.png",caption:"ClimbNav-R integrated rocker-bogie and climbing modules"},{src:"assets/climbnav/rocker-bogie-kinematics.png",caption:"Rocker-bogie and climbing-module kinematic model"},{src:"assets/climbnav/climbing-module-design.png",caption:"Bio-inspired climbing module mechanical design"},{src:"assets/climbnav/ackermann-steering.png",caption:"Hybrid bicycle–Ackermann steering geometry"},{src:"assets/climbnav/terrain-power-results.png",caption:"Experimental terrain power-consumption results"},{src:"assets/climbnav/climbing-transition-model.png",caption:"Climbing-module transition stability model"}]},{authors:"Alameer, M., Al-Barashi, M., Jallow, A., Zhou, Z.",title:"Hybrid DDPG-based adaptive PID control for six-wheel rocker-bogie rover",venue:"International Journal of Intelligent Robotics and Applications",year:"2026",doiUrl:"https://doi.org/10.1007/s41315-026-00568-1",doiLabel:"10.1007/s41315-026-00568-1",abstractSummary:"This article presents a hybrid control framework in which independent DDPG agents tune the steering and drive PID gains of a six-wheel rocker-bogie rover online. In high-fidelity MATLAB/Simscape Multibody simulations, the shaped-reward controller reduced mean absolute steering error by about 81.0% and drive wheel-speed error by about 51.6% versus fixed-gain PID, while improving stability across multiple training seeds.",figures:[{src:"https://media.springernature.com/m312/springer-static/image/art%3A10.1007%2Fs41315-026-00568-1/MediaObjects/41315_2026_568_Fig1_HTML.png",caption:"Published figure 1"},{src:"https://media.springernature.com/m312/springer-static/image/art%3A10.1007%2Fs41315-026-00568-1/MediaObjects/41315_2026_568_Fig5_HTML.png",caption:"Published figure 5"},{src:"https://media.springernature.com/m312/springer-static/image/art%3A10.1007%2Fs41315-026-00568-1/MediaObjects/41315_2026_568_Fig9_HTML.png",caption:"Published figure 9"}]},{authors:"Jallow, A., Zhang, F., Alameer, M., Sun, T., Chen, Z., Liu, X., Peng, Y., Wangyang, P., Zhu, J., Shifeng, X., Li, H.",title:"Evaluating the mechanical stability and flexibility of Ga₂O₃ films on mica substrates via pulsed laser deposition and CASTEP simulations",venue:"Journal of Crystal Growth, 648: 127900",year:"2024",doiUrl:"https://doi.org/10.1016/j.jcrysgro.2024.127900",doiLabel:"10.1016/j.jcrysgro.2024.127900",abstractSummary:"This study combines CASTEP first-principles calculations with pulsed laser deposition experiments to evaluate β-Ga₂O₃ thin films grown on flexible mica. The simulations indicate a wide bandgap of 4.98 eV, while X-ray diffraction shows crystallite growth from 26 nm to 152 nm as the substrate temperature rises from 500 °C to 800 °C. Microscopy and calculated elastic properties confirm improved film quality and strong mechanical stability, supporting the use of Ga₂O₃-on-mica structures in flexible and high-stress optoelectronic devices.",keywords:["β-Ga₂O₃ thin films","Mica substrates","Pulsed laser deposition","CASTEP","Flexible electronics"],figures:[{src:"https://ars.els-cdn.com/content/image/1-s2.0-S002202482400335X-gr1.jpg",caption:"β-Ga₂O₃ crystal structure used in CASTEP analysis"},{src:"https://ars.els-cdn.com/content/image/1-s2.0-S002202482400335X-gr3.jpg",caption:"Calculated electronic band structure and 4.98 eV bandgap"},{src:"https://ars.els-cdn.com/content/image/1-s2.0-S002202482400335X-gr5.jpg",caption:"XRD patterns for mica and films deposited at different temperatures"}]},{authors:"Al-Barashi, M., Wang, Y., Tang, Z., Alameer, M.",title:"Variable speed wind turbine control system with doubly-fed induction generator",venue:"Proc. 2025 International Conference on Electrical Automation and Artificial Intelligence (ICEAAI), IEEE, 361–367",year:"2025",doiUrl:"https://doi.org/10.1109/ICEAAI64185.2025.10956445",doiLabel:"10.1109/ICEAAI64185.2025.10956445",abstractSummary:"This paper studies the steady-state and dynamic control of a variable-speed wind turbine equipped with a doubly-fed induction generator (DFIG). With the stator connected directly to the grid, the rotor-side converter regulates active and reactive power. Simulation results demonstrate that the proposed control strategy can regulate turbine output power under changing operating conditions in a manner comparable to conventional generating plants.",keywords:["Wind energy","Doubly-fed induction generator","Variable-speed turbine","Active and reactive power","Dynamic simulation"]},{authors:"El-Hadi, A., El-Hadi, I. A., Alameer, M. A.",title:"The Normal: Minimising Energy Use; The Abnormal: Changing Habits",venue:"Mediterranean Green Buildings & Renewable Energy — Med Green Forum, Springer",year:"2016",doiUrl:"https://doi.org/10.1007/978-3-319-30746-6_14",doiLabel:"10.1007/978-3-319-30746-6_14",abstractSummary:"This chapter investigates how building geometry, orientation and insulation influence thermal loads. Equal-area square, rectangular and hemispherical-dome models are compared using ASHRAE procedures and finite-element analysis. The dome produces the lowest calculated external thermal load, while an advanced insulating material further reduces heat ingress. The study concludes that durable energy savings require both energy-conscious architectural decisions and changes in everyday occupant habits.",keywords:["Building energy","Thermal load","Dome geometry","Insulation","Energy-saving behaviour"]}]},education:{eyebrow:"05 — Education",heading:"Education",items:[{degree:"PhD in Mechanical Engineering (ongoing, expected 2026)",inst:"Guilin University of Electronic Technology (GUET), China",period:"2021 – 2026",detail:"Research focus: dual-mode robotic systems, rocker–bogie rovers, climbing robots, and reinforcement-learning-based adaptive PID control."},{degree:"MSc in Mechanical Engineering",inst:"Sudan University of Science and Technology, Sudan",period:"2015 – 2018",detail:"Thesis: “A Proposed Solution for the Erosive Wear Problem in Garri-4 Power Plant Sand Conveying System.”"},{degree:"BSc (Hons) in Mechanical Engineering — Class One",inst:"University of Bahri, Sudan",period:"2008 – 2014",detail:"Weighted GPA 3.71 · Dissertation: “Design of Hydraulic Engine.”"}],trainingHeading:"Professional & Pedagogical Training",trainingIntro:"Certified short-courses supporting my teaching and engineering practice.",training:[{title:"Systems and Methods of University Teaching",org:"Khartoum University Center for Advanced Training",year:"2018"},{title:"Instructional Technology in University Teaching",org:"Khartoum University Center for Advanced Training",year:"2018"},{title:"Measurement and Evaluation in Higher Education",org:"Khartoum University Center for Advanced Training",year:"2018"},{title:"Basics of Scientific Research & Scientific Writing",org:"Khartoum University Center for Advanced Training",year:"2018"},{title:"Scientific Paper Writing",org:"University of Bahri",year:"2015"},{title:"Steam Turbine Troubleshooting",org:"Training Center for Integrated Development (Um Haraz)",year:"2016"},{title:"Boiler, Turbine & Auxiliaries: Procedures and Troubleshooting",org:"Garri-4 CFB Power Plant",year:"2018"},{title:"Primavera Project Management",org:"Training Center for Integra "论文著作",intro:"已发表的同行评审期刊论文及会议论文。",viewPaper:"查看论文 / DOI",scholarBtn:"Google Scholar",underRevision:"修改中",items:[{authors:"Alameer, M., Yao, L., Liu, X. 等",title:"ClimbNav-R: A dual-mode robot for seamless ground-to-vertical transitions in limited-access environments",venue:"Journal of Mechanical Science and Technology",year:"2026",doiUrl:"https://doi.org/10.1007/s12206-026-0451-2",doiLabel:"10.1007/s12206-026-0451-2",abstractSummary:"在非结构化和受限环境中导航对机器人平台构成重大挑战。本文提出 ClimbNav-R——一种双模式机器人系统，由重新设计的摇臂-转向架底盘与可拆卸的七自由度（7-DOF）攀爬模块组成。其创新之处在于采用机械与运动学一体化的解耦设计，使两种模式都能针对各自功能进行优化，从而实现承载转换、增强攀爬能力和稳定运行。ClimbNav-R 结合运动学建模、PID 控制及混合自行车–Ackermann 转向方法，实现稳定的地面与攀爬运动，并通过对模式切换过程的详细运动学分析保证转换稳定性。在平地、斜坡和台阶等五种地形上的实验表明，该系统能够跨越 15 cm 障碍。与平整光滑地面相比，平整粗糙地面、光滑斜坡和粗糙斜坡上的功耗分别增加 50%、30% 和 100%。结果验证了 ClimbNav-R 的性能及其户外应用潜力；未来工作将聚焦自主化与能源优化。",keywords:["双模式机器人系统","摇臂-转向架移动","攀爬机构","运动集成","受限环境"],figures:[{src:"assets/climbnav/climbnav-platform.png",caption:"ClimbNav-R 摇臂-转向架与攀爬模块集成平台"},{src:"assets/climbnav/rocker-bogie-kinematics.png",caption:"摇臂-转向架与攀爬模块运动学模型"},{src:"assets/climbnav/climbing-module-design.png",caption:"仿生攀爬模块机械设计"},{src:"assets/climbnav/ackermann-steering.png",caption:"混合自行车–Ackermann 转向几何"},{src:"assets/climbnav/terrain-power-results.png",caption:"不同地形下的实验功耗结果"},{src:"assets/climbnav/climbing-transition-model.png",caption:"攀爬模块转换稳定性模型"}]},{authors:"Alameer, M., Al-Barashi, M., Jallow, A., Zhou, Z.",title:"Hybrid DDPG-based adaptive PID control for six-wheel rocker-bogie rover",venue:"International Journal of Intelligent Robotics and Applications",year:"2026",doiUrl:"https://doi.org/10.1007/s41315-026-00568-1",doiLabel:"10.1007/s41315-026-00568-1",abstractSummary:"本文提出一种混合控制框架，由两个独立的 DDPG 智能体在线调节六轮摇臂-转向架火星车的转向与驱动 PID 增益。在高保真 MATLAB/Simscape Multibody 仿真中，塑形奖励控制器相较固定增益 PID 将平均绝对转向误差降低约 81.0%，驱动轮速误差降低约 51.6%，并在多随机种子验证中表现出更好的稳定性。",figures:[{src:"https://media.springernature.com/m312/springer-static/image/art%3A10.1007%2Fs41315-026-00568-1/MediaObjects/41315_2026_568_Fig1_HTML.png",caption:"论文图 1"},{src:"https://media.springernature.com/m312/springer-static/image/art%3A10.1007%2Fs41315-026-00568-1/MediaObjects/41315_2026_568_Fig5_HTML.png",caption:"论文图 5"},{src:"https://media.springernature.com/m312/springer-static/image/art%3A10.1007%2Fs41315-026-00568-1/MediaObjects/41315_2026_568_Fig9_HTML.png",caption:"论文图 9"}]},{authors:"Jallow, A., Zhang, F., Alameer, M., Sun, T., Chen, Z., Liu, X., Peng, Y., Wangyang, P., Zhu, J., Shifeng, X., Li, H.",title:"Evaluating the mechanical stability and flexibility of Ga₂O₃ films on mica substrates via pulsed laser deposition and CASTEP simulations",venue:"Journal of Crystal Growth, 648: 127900",year:"2024",doiUrl:"https://doi.org/10.1016/j.jcrysgro.2024.127900",doiLabel:"10.1016/j.jcrysgro.2024.127900",abstractSummary:"本研究结合 CASTEP 第一性原理计算与脉冲激光沉积实验，评估生长在柔性云母衬底上的 β-Ga₂O₃ 薄膜。模拟得到约 4.98 eV 的宽带隙；X 射线衍射结果表明，当衬底温度由 500 °C 升至 800 °C 时，晶粒尺寸由 26 nm 增至 152 nm。显微结构观察与弹性性能计算共同证实薄膜质量和机械稳定性得到提升，说明 Ga₂O₃/云母结构适用于柔性及高应力光电子器件。",keywords:["β-Ga₂O₃ 薄膜","云母衬底","脉冲激光沉积","CASTEP","柔性电子"],figures:[{src:"https://ars.els-cdn.com/content/image/1-s2.0-S002202482400335X-gr1.jpg",caption:"CASTEP 分析采用的 β-Ga₂O₃ 晶体结构"},{src:"https://ars.els-cdn.com/content/image/1-s2.0-S002202482400335X-gr3.jpg",caption:"计算得到的电子能带结构与 4.98 eV 带隙"},{src:"https://ars.els-cdn.com/content/image/1-s2.0-S002202482400335X-gr5.jpg",caption:"云母及不同沉积温度薄膜的 XRD 图谱"}]},{authors:"Al-Barashi, M., Wang, Y., Tang, Z., Alameer, M.",title:"Variable speed wind turbine control system with doubly-fed induction generator",venue:"2025 国际电气自动化与人工智能会议（ICEAAI）论文集, IEEE, 361–367",year:"2025",doiUrl:"https://doi.org/10.1109/ICEAAI64185.2025.10956445",doiLabel:"10.1109/ICEAAI64185.2025.10956445",abstractSummary:"本文研究配备双馈感应发电机（DFIG）的变速风力机在稳态和动态条件下的控制。定子直接并网，转子侧变流器负责调节有功与无功功率。仿真结果表明，所提出的控制策略能够在运行条件变化时有效调节风机输出功率，其调节能力可与常规发电机组相媲美。",keywords:["风能","双馈感应发电机","变速风力机","有功与无功功率","动态仿真"]},{authors:"El-Hadi, A., El-Hadi, I. A., Alameer, M. A.",title:"The Normal: Minimising Energy Use; The Abnormal: Changing Habits",venue:"Mediterranean Green Buildings & Renewable Energy — Med Green Forum, Springer",year:"2016",doiUrl:"https://doi.org/10.1007/978-3-319-30746-6_14",doiLabel:"10.1007/978-3-319-30746-6_14",abstractSummary:"本章研究建筑几何形态、朝向和保温性能对热负荷的影响。研究采用 ASHRAE 计算方法和有限元分析，对等面积的方形、矩形及半球形穹顶建筑模型进行比较。结果表明，穹顶模型的外部计算热负荷最低，先进保温材料还能进一步减少热量进入。研究认为，持久的节能不仅依赖注重能源效率的建筑设计，也需要改变使用者的日常习惯。",keywords:["建筑节能","热负荷","穹顶几何","保温材料","节能行为"]}]},education:{eyebrow:"05 — 学习经历",heading:"学习经历",items:[{degree:"机械工程博士研究生（在读，预计2026年毕业）",inst:"桂林电子科技大学（GUET），中国",period:"2021 – 2026",detail:"研究方向：双模式机器人系统、摇臂-转向架火星车、攀爬机器人及基于强化学习的自适应 PID 控制。"},{degree:"机械工程硕士",inst:"苏丹科技大学，苏丹",period:"2015 – 2018",detail:"硕士论文：《Garri-4 电厂输砂系统磨蚀磨损问题的解决方案研究》。"},{degree:"机械工程学士（荣誉学位·一等）",inst:"巴赫里大学，苏丹",period:"2008 – 2014",detail:"加权平均绩点 3.71 · 毕业设计：《液压发动机设计》。"}],trainingHeading:"专业与教学培训",trainingIntro:"支持我教学与工程实践的资质培训课程。",training:[{title:"大学教学制度与方法",org:"喀土穆大学高级培训中心",year:"2018"},{title:"大学教学信息技术",org:"喀土穆大学高级培训中心",year:"2018"},{title:"高等教育测量与评价",org:"喀土穆大学高级培训中心",year:"2018"},{title:"科学研究与科学写作基础",org:"喀土穆大学高级培训中心",year:"2018"},{title:"科学论文写作",org:"巴赫里大学",year:"2015"},{title:"汽轮机故障诊断培训",org:"综合发展培训中心（Um Haraz）",year:"2016"},{title:"锅炉、汽轮机及辅助设备运行与故障处理",org:"Garri-4 CFB 电厂",year:"2018"},{title:"Primavera 项目管理软件培训",org:"综合发展培训中心（Um Haraz）",year:"2021"},{title:"创业培训项目",org:"英国文化教育协会（苏丹）",year:"2015"},{title:"综合机电给排水（MEP）系统培训",org:"Top Leaders 专业培训中心",year:"2022"}]},teaching:{eyebrow:"06 — 教学经历",heading:"教学经历",intro:"七年以上机械工程课程教学与辅导经验。",coursesLabel:"授课课程",items:[{role:"机械工程讲师",org:"巴赫里大学工程学院，苏丹",period:"2018 – 2022",bullets:["工程制图与 CAD 应用","机械振动","车间技术","热力学 I & II","传热学","HVAC 系统设计与运行","设计课程大纲、讲义、实验及练习材料。","指导本科毕业设计，并培养学生科研方法。","结合行业案例与仿真工具，提升学生学习成效。"]},{role:"机械工程助教",org:"巴赫里大学，苏丹",period:"2014 – 2018",bullets:["工程热力学","流体力学","材料力学","制造工艺","机械设计基础","协助实验课、批改作业、辅导答疑及学生咨询。","参与系部教学与专业认证相关工作。"]}]},industry:{eyebrow:"07 — 工业经历",heading:"工业经历",items:[{role:"高级值班运行工程师",org:"苏丹热电发电有限公司 Garri-4 电厂",period:"2016 – 2022",bullets:["负责 C ding:"نبذة عني",paragraph:"طالب دكتوراه في الهندسة الميكانيكية ومحاضر جامعي بخبرة تدريسية تتجاوز سبع سنوات، مدعومة بخلفية قوية في الأنظمة الميكانيكية على المستوى الصناعي. يركّز بحثي على الروبوتات المتنقلة العابرة للتضاريس الوعرة والاستكشاف الكوكبي، وهياكل المركبات الجوالة ذات نظام rocker–bogie، والتحكم التكيّفي القائم على التعلم المعزز. أمتلك خبرة عملية في النمذجة عالية الدقة باستخدام MATLAB/Simulink وSimscape Multibody، إضافة إلى خبرة في بناء النماذج الأولية واختبارها والتحقق منها. يجمع ملفي الأكاديمي بين التصميم الميكانيكي، والتحكم الذكي، والتحليل القائم على المحاكاة، والتدريس المرتكز على البحث العلمي. وأنا قادر على تدريس المقررات الأساسية في الهندسة الميكانيكية إلى جانب المساهمة في أبحاث الروبوتات والميكاترونكس والأنظمة الذكية. كما أعمل حاليًا على إعداد أبحاث منشورة في مجلات مصنّفة SCI في مجالي الروبوتات المتنقلة والتحكم التكيّفي.",stats:[{value:"+٧",label:"سنوات التدريس الجامعي"},{value:"٦",label:"سنوات كمهندس محطة طاقة"},{value:"٥",label:"أبحاث محكّمة منشورة"},{value:"٢٠٢٦",label:"الموعد المتوقع لإنهاء الدكتوراه"}]},interests:{eyebrow:"٠٢ — اهتمامات",heading:"اهتمامات البحث والتدريس",intro:"المحاور التي تمتد عبر أبحاثي في الدكتوراه وممارستي التدريسية.",items:[{title:"الروبوتات المتنقلة ثنائية النمط",body:"مركبات جوالة للتضاريس الوعرة والاستكشاف الكوكبي، بما في ذلك الأنظمة ثنائية النمط أرضي-عمودي."},{title:"التحكم القائم على التعلم المعزز",body:"متحكمات PID تكيّفية ومتحكمات قائمة على التعلم المعزز (DDPG، TD3، DDQN) للتوجيه والسرعة والاستقرار."},{title:"التحكم المتقدم والمحاكاة",body:"نمذجة عالية الدقة باستخدام MATLAB/Simulink وSimscape Multibody للديناميكا وتفاعل العجلة مع التضاريس."},{title:"التصميم الميكانيكي وبناء النماذج",body:"التصميم الميكانيكي، والتجميع، ودمج المستشعرات، والتحقق التجريبي من عتاد المركبة الجوالة."}]},projects:{eyebrow:"٠٣ — البحث",heading:"المشاريع البحثية",intro:"أعمال مختارة من بحث الدكتوراه في جامعة قويلين للإلكترونيات والتكنولوجيا (GUET)، حول تصميم الروبوتات ونمذجتها والتحكم التكيّفي فيها.",items:[{tag:"منصة جوالة",title:"مركبة جوالة سداسية العجلات بهيكل Rocker-Bogie",description:"تصميم وتطوير منصة جوالة سداسية العجلات مستوحاة من مركبات الاستكشاف الكوكبي، مع التركيز على القدرة على الحركة في التضاريس الوعرة، ومفصلية نظام التعليق السلبي، والقدرة على تجاوز العوائق."},{tag:"نظام ثنائي النمط",title:"ClimbNav-R — روبوت تسلّق أرضي-عمودي",description:"تطوير نظام روبوتي ثنائي النمط يدمج مركبة جوالة أرضية مع آلية تسلّق قابلة للفصل للعمل في البيئات صعبة الوصول مثل الأشجار والأعمدة والتضاريس الخارجية غير المستوية."},{tag:"محاكاة عالية الدقة",title:"نمذجة ديناميكية بواسطة Simulink وSimscape Multibody",description:"بناء نماذج محاكاة عالية الدقة باستخدام MATLAB/Simulink وSimscape Multibody لتحليل ديناميكا المركبة، وتفاعل العجلة مع التضاريس، وسلوك التعليق، واستقرار النظام تحت ظروف تضاريس مختلفة."},{tag:"تحكم تكيّفي",title:"تحكم PID تكيّفي قائم على DDPG",description:"تصميم وتنفيذ إطار تحكم PID تكيّفي قائم على التعلم المعزز باستخدام خوارزمية DDPG لتنظيم التوجيه والسرعة لمركبة جوالة سداسية العجلات."},{tag:"دراسة تحقق",title:"تحليل مقارن لاستراتيجيات التحكم",description:"إجراء تحقق قائم على المحاكاة وتحليل مقارن بين التحكم التقليدي PID، وDDPG الأساسي، وDDPG بمكافأة مُشكَّلة، لتتبع المسار واستقرار الحركة."},{tag:"العتاد",title:"بناء نموذج تجريبي للمركبة الجوالة",description:"دعم بناء والتحقق من نموذج تجريبي مخصص لعتاد المركبة الجوالة، شاملاً التجميع الميكانيكي، ودمج المستشعرات، والقياس بواسطة المشفّرات، واختبار عبور التضاريس."}]},publications:{eyebrow:"٠٤ — الإنتاج العلمي",heading:"المنشورات",intro:"أبحاث محكّمة منشورة في مجلات علمية وأوراق مؤتمرات.",viewPaper:"عرض البحث / DOI",scholarBtn:"Google Scholar",underRevision:"قيد المراجعة",items:[{authors:"Alameer, M., Yao, L., Liu, X. وآخرون",title:"ClimbNav-R: A dual-mode robot for seamless ground-to-vertical transitions in limited-access environments",venue:"Journal of Mechanical Science and Technology",year:"2026",doiUrl:"https://doi.org/10.1007/s12206-026-0451-2",doiLabel:"10.1007/s12206-026-0451-2",abstractSummary:"يمثل التنقل في البيئات غير المنظمة والمحصورة تحدياً كبيراً للمنصات الروبوتية. تقدم هذه الورقة ClimbNav-R، وهو نظام روبوتي ثنائي النمط يجمع بين هيكل rocker-bogie معاد التصميم ووحدة تسلق قابلة للفصل ذات سبع درجات من الحرية. تكمن الجدة في تصميم مفصول ومتكامل ميكانيكياً وحركياً، بما يسمح بتحسين كل نمط لوظيفته وتحقيق انتقالات حاملة للأحمال وتسلق محسن وتشغيل مستقر. يستخدم ClimbNav-R النمذجة الحركية وتحكم PID ونهج توجيه هجين bicycle–Ackermann لتحقيق حركة مستقرة على الأرض وأثناء التسلق، مع ضمان استقرار الانتقال عبر تحليل حركي مفصل لعملية تبديل النمط. أظهرت التجارب على خمسة أنواع من التضاريس، تشمل الأسطح المستوية والمائلة والمتدرجة، قدرة النظام على تجاوز عوائق بارتفاع 15 سم. ارتفع استهلاك الطاقة بنسبة 50% على التضاريس المستوية الخشنة، و30% على المنحدرات الملساء، و100% على المنحدرات الخشنة مقارنة بالسطح المستوي الأملس. تؤكد النتائج أداء ClimbNav-R وإمكاناته للتطبيقات الخارجية، مع توجيه العمل المستقبلي نحو الاستقلالية وتحسين الطاقة.",keywords:["نظام روبوتي ثنائي النمط","حركة rocker-bogie","آلية التسلق","تكامل الحركة","البيئات محدودة الوصول"],figures:[{src:"assets/climbnav/climbnav-platform.png",caption:"منصة ClimbNav-R المدمجة بنظام rocker-bogie ووحدة التسلق"},{src:"assets/climbnav/rocker-bogie-kinematics.png",caption:"النموذج الحركي لنظام rocker-bogie ووحدة التسلق"},{src:"assets/climbnav/climbing-module-design.png",caption:"التصميم الميكانيكي الحيوي لوحدة التسلق"},{src:"assets/climbnav/ackermann-steering.png",caption:"هندسة توجيه bicycle–Ackermann الهجينة"},{src:"assets/climbnav/terrain-power-results.png",caption:"نتائج استهلاك الطاقة التجريبية عبر التضاريس"},{src:"assets/climbnav/climbing-transition-model.png",caption:"نموذج استقرار انتقال وحدة التسلق"}]},{authors:"Alameer, M., Al-Barashi, M., Jallow, A., Zhou, Z.",title:"Hybrid DDPG-based adaptive PID control for six-wheel rocker-bogie rover",venue:"International Journal of Intelligent Robotics and Applications",year:"2026",doiUrl:"https://doi.org/10.1007/s41315-026-00568-1",doiLabel:"10.1007/s41315-026-00568-1",abstractSummary:"تقدم المقالة إطار تحكم هجيناً يستخدم وكيلين مستقلين من DDPG لضبط معاملات PID للتوجيه والدفع في مركبة جوالة سداسية العجلات أثناء التشغيل. في محاكاة عالية الدقة باستخدام MATLAB وSimscape Multibody، خفّض المتحكم ذو المكافأة المُشكّلة متوسط خطأ التوجيه المطلق بنحو 81.0% وخطأ سرعة عجلات الدفع بنحو 51.6% مقارنةً بـ PID ثابت المعاملات، مع استقرار أفضل عبر بذور تدريب متعددة.",figures:[{src:"https://media.springernature.com/m312/springer-static/image/art%3A10.1007%2Fs41315-026-00568-1/MediaObjects/41315_2026_568_Fig1_HTML.png",caption:"الشكل المنشور 1"},{src:"https://media.springernature.com/m312/springer-static/image/art%3A10.1007%2Fs41315-026-00568-1/MediaObjects/41315_2026_568_Fig5_HTML.png",caption:"الشكل المنشور 5"},{src:"https://media.springernature.com/m312/springer-static/image/art%3A10.1007%2Fs41315-026-00568-1/MediaObjects/41315_2026_568_Fig9_HTML.png",caption:"الشكل المنشور 9"}]},{authors:"Jallow, A., Zhang, F., Alameer, M., Sun, T., Chen, Z., Liu, X., Peng, Y., Wangyang, P., Zhu, J., Shifeng, X., Li, H.",title:"Evaluating the mechanical stability and flexibility of Ga₂O₃ films on mica substrates via pulsed laser deposition and CASTEP simulations",venue:"Journal of Crystal Growth, 648: 127900",year:"2024",doiUrl:"https://doi.org/10.1016/j.jcrysgro.2024.127900",doiLabel:"10.1016/j.jcrysgro.2024.127900",abstractSummary:"تجمع هذه الدراسة بين حسابات المبادئ الأولى باستخدام CASTEP وتجارب الترسيب بالليزر النبضي لتقييم أغشية β-Ga₂O₃ الرقيقة المرسبة على الميكا المرنة. أظهرت المحاكاة فجوة نطاق واسعة مقدارها 4.98 إلكترون فولت، بينما بيّن حيود الأشعة السينية نمو حجم البلورات من 26 إلى 152 نانومتر عند رفع حرارة الركيزة من 500 إلى 800 درجة مئوية. وتؤكد صور البنية المجهرية والخواص المرنة المحسوبة تحسن جودة الغشاء وثباته الميكانيكي، بما يدعم استخدام تراكيب Ga₂O₃ على الميكا في الأجهزة الإلكترونية البصرية المرنة وعالية الإجهاد.",keywords:["أغشية β-Ga₂O₃ الرقيقة","ركائز الميكا","الترسيب بالليزر النبضي","CASTEP","الإلكترونيات المرنة"],figures:[{src:"https://ars.els-cdn.com/content/image/1-s2.0-S002202482400335X-gr1.jpg",caption:"البنية البلورية لـ β-Ga₂O₃ المستخدمة في تحليل CASTEP"},{src:"https://ars.els-cdn.com/content/image/1-s2.0-S002202482400335X-gr3.jpg",caption:"بنية نطاق الطاقة المحسوبة وفجوة النطاق 4.98 إلكترون فولت"},{src:"https://ars.els-cdn.com/content/image/1-s2.0-S002202482400335X-gr5.jpg",caption:"أنماط XRD للميكا والأغشية المرسبة عند درجات حرارة مختلفة"}]},{authors:"Al-Barashi, M., Wang, Y., Tang, Z., Alameer, M.",title:"Variable speed wind turbine control system with doubly-fed induction generator",venue:"أعمال مؤتمر ICEAAI 2025 الدولي للأتمتة الكهربائية والذكاء الاصطناعي، IEEE، ص. 361–367",year:"2025",doiUrl:"https://doi.org/10.1109/ICEAAI64185.2025.10956445",doiLabel:"10.1109/ICEAAI64185.2025.10956445",abstractSummary:"تبحث الورقة التحكم في الحالة المستقرة والأداء الديناميكي لتوربين رياح متغير السرعة مزود بمولد حثي مزدوج التغذية (DFIG). يتصل الجزء الثابت مباشرة بالشبكة، بينما ينظم محول جانب الدوار القدرة الفعالة وغير الفعالة. وتوضح نتائج المحاكاة أن استراتيجية التحكم المقترحة تضبط قدرة خرج التوربين عند تغير ظروف التشغيل بصورة مماثلة لمحطات التوليد التقليدية.",keywords:["طاقة الرياح","مولد حثي مزدوج التغذية","توربين متغير السرعة","القدرة الفعالة وغير الفعالة","المحاكاة الديناميكية"]},{authors:"El-Hadi, A., El-Hadi, I. A., Alameer, M. A.",title:"The Normal: Minimising Energy Use; The Abnormal: Changing Habits",venue:"Mediterranean Green Buildings & Renewable Energy — Med Green Forum, Springer",year:"2016",doiUrl:"https://doi.org/10.1007/978-3-319-30746-6_14",doiLabel:"10.1007/978-3-319-30746-6_14",abstractSummary:"يدرس هذا الفصل تأثير شكل المبنى واتجاهه والعزل الحراري في الأحمال الحرارية. ويقارن نماذج متساوية المساحة لمبانٍ مربعة ومستطيلة وقبة نصف كروية باستخدام إجراءات ASHRAE وتحليل العناصر المحددة. حقق نموذج القبة أقل حمل حراري خارجي محسوب، كما خفّضت مادة عازلة متقدمة انتقال الحرارة بدرجة إضافية. وتخلص الدراسة إلى أن التوفير المستدام للطاقة يتطلب قرارات معمارية تراعي كفاءة الطاقة، إلى جانب تغيير العادات اليومية للمستخدمين.",keywords:["طاقة المباني","الحمل الحراري","هندسة
